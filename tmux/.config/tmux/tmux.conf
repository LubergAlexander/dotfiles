# Plugin manager

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Ctrl-h/j/k/l moves across nvim splits and tmux panes (pairs with the nvim plugin).
set -g @plugin 'christoomey/vim-tmux-navigator'
# The standalone installer runs before TPM's entrypoint on a fresh machine.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @shell_mode 'vi'
bind-key -T copy-mode-vi 'v' send -X begin-selection

# fzf-grab text/paths/URLs from the screen (replaces copycat + fpp)
set -g @plugin 'laktak/extrakto'

# Empty extrakto keys restore defaults. Sharing the copy key instead makes its
# earlier copy dispatch win, so neither shell-based open nor editor can run.
set -g @extrakto_copy_key 'enter'
set -g @extrakto_open_key 'enter'
set -g @extrakto_edit_key 'enter'
set -g @extrakto_fzf_header 'i c f g h'
# Search at the top of a centered popup; size matches the other pickers.
# Shared defaults are appearance-only; shell widgets own previews and borders.
# The tmux popup supplies extrakto's single rounded border.
set -g @extrakto_fzf_unset_default_opts 'false'
set -ag update-environment ' FZF_DEFAULT_OPTS'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_popup_size '80%,60%'
set -g @extrakto_popup_position 'C'

set-option -g default-shell /bin/zsh
if-shell 'test "$(uname -s)" = Darwin && test -x /opt/homebrew/bin/zsh' \
    'set-option -g default-shell /opt/homebrew/bin/zsh' \
    'if-shell "test \"$(uname -s)\" = Darwin && test -x /usr/local/bin/zsh" "set-option -g default-shell /usr/local/bin/zsh"'

set -g prefix `
bind ` send-prefix
# force a reload of the config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
# vim-tmux-navigator takes C-l; prefix C-l still clears the shell screen.
bind C-l send-keys C-l

# ask before killing a session
bind X confirm-before "kill-session -t ''"

# use base 1 numbering
set -g base-index 1
set-window-option -g pane-base-index 1

# Advertise native tmux capabilities; remote hosts need this terminfo entry.
set-option -g default-terminal "tmux-256color"

# Pass modified keys (Shift+Enter, C-i vs Tab) to apps that request them.
set -g extended-keys on
set -g extended-keys-format csi-u
# Fixed index so `prefix r` reloads replace rather than append duplicates.
set -s terminal-features[99] 'xterm-ghostty:RGB:extkeys:clipboard'

# Let image protocols (yazi, snacks.image) reach the terminal.
set -g allow-passthrough on

# Do not autorename windows
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Close numbering gaps when a window is killed.
set -g renumber-windows on

# Use vim bindings
set-window-option -g mode-keys vi

# Enable mouse support, including scroll wheel in panes.
set-option -g mouse on

unbind %
bind '-' split-window -v
bind '\' split-window -h

bind  Space next-window
bind BSpace previous-window

set-option -g focus-events on

# Native selection pipes carry text on stdin, never in shell source.
bind-key -T copy-mode-vi o send-keys -X copy-pipe-and-cancel 'python3 "$HOME/.config/tmux/open-selection.py" open #{pane_id} #{q:session_id}'
bind-key -T copy-mode o send-keys -X copy-pipe-and-cancel 'python3 "$HOME/.config/tmux/open-selection.py" open #{pane_id} #{q:session_id}'
bind-key -T copy-mode-vi C-o send-keys -X copy-pipe-and-cancel 'python3 "$HOME/.config/tmux/open-selection.py" edit #{pane_id} #{q:session_id}'
bind-key -T copy-mode C-o send-keys -X copy-pipe-and-cancel 'python3 "$HOME/.config/tmux/open-selection.py" edit #{pane_id} #{q:session_id}'

# Dark until a terminal reports its theme. Native reporting requires tmux 3.7+
# and a supporting terminal (Ghostty); the latest reporting client wins.
source-file ~/.config/tmux/themes/gruvbox-dark.conf
if-shell -F '#{>=:#{version},3.7}' {
    set-hook -g client-light-theme 'source-file ~/.config/tmux/themes/gruvbox-light.conf'
    set-hook -g client-dark-theme 'source-file ~/.config/tmux/themes/gruvbox-dark.conf'
    set-hook -g client-attached 'if-shell -F "#{==:#{client_theme},light}" "source-file ~/.config/tmux/themes/gruvbox-light.conf" "source-file ~/.config/tmux/themes/gruvbox-dark.conf"'
    if-shell -F '#{==:#{client_theme},light}' 'source-file ~/.config/tmux/themes/gruvbox-light.conf'
}

# Bootstrap before invoking TPM; all options and plugin settings precede it.
if-shell 'test ! -d "$HOME/.config/tmux/plugins/tpm"' \
    'run-shell "git clone https://github.com/tmux-plugins/tpm \"$HOME/.config/tmux/plugins/tpm\" && \"$HOME/.config/tmux/plugins/tpm/bin/install_plugins\""'
run-shell '"$HOME/.config/tmux/plugins/tpm/tpm"'
