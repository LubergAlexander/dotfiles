# Adapted 2026-09-04 from egel/tmux-gruvbox's dark256 palette/status layout:
# https://github.com/egel/tmux-gruvbox (GPL-3.0; see COPYING).
# Converted from shell-generated commands to native tmux configuration.
set -g status on
set -g status-style bg=colour237,fg=colour223
setw -g window-status-style bg=colour214,fg=colour237
setw -g window-status-activity-style bg=colour237,fg=colour248
setw -g window-status-current-style bg=colour214,fg=colour237
set -g pane-active-border-style fg=colour250
set -g pane-border-style fg=colour237
set -g message-style bg=colour239,fg=colour223
set -g message-command-style bg=colour248,fg=colour237
set -g display-panes-active-colour colour250
set -g display-panes-colour colour237
setw -g clock-mode-colour colour109
setw -g window-status-bell-style bg=colour167,fg=colour235
set -g status-justify left
set -g status-left-style none
set -g status-left-length 80
set -g status-right-style none
set -g status-right-length 80
setw -g window-status-separator ''
set -g status-left '#[bg=colour241,fg=colour248] #S #[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]'
set -g status-right '#[bg=colour237,fg=colour239,nobold,nounderscore,noitalics]#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]#[bg=colour248,fg=colour237] #h'
setw -g window-status-current-format '#[bg=colour214,fg=colour237,nobold,noitalics,nounderscore]#[bg=colour214,fg=colour239] #I #[bg=colour214,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour237]#[fg=colour214,nobold,noitalics,nounderscore]'
setw -g window-status-format '#[bg=colour239,fg=colour237,noitalics]#[bg=colour239,fg=colour223] #I #[bg=colour239,fg=colour223] #W #[bg=colour237]#[fg=colour239,noitalics]'
