# Adapted 2026-09-04 from egel/tmux-gruvbox's dark256 palette:
# https://github.com/egel/tmux-gruvbox (GPL-3.0; see COPYING).
# Converted from shell-generated commands to native tmux configuration.
# A continuous Gruvbox dark1 rail separates status segments from the canvas.
set -g status on
set -g status-style bg=#3c3836,fg=#a89984
setw -g window-status-style bg=#504945,fg=#a89984
setw -g window-status-activity-style bg=#504945,fg=#ebdbb2
setw -g window-status-current-style bg=#fabd2f,fg=#282828,bold
set -g pane-active-border-style fg=#7c6f64
set -g pane-border-style fg=#504945
set -g message-style bg=#3c3836,fg=#ebdbb2
set -g message-command-style bg=#3c3836,fg=#ebdbb2
set -g display-panes-active-colour '#7c6f64'
set -g display-panes-colour '#504945'
setw -g clock-mode-colour '#83a598'
setw -g window-status-bell-style bg=#504945,fg=#fb4934
set -g popup-border-lines rounded
set -g popup-style bg=#282828,fg=#ebdbb2
set -g popup-border-style fg=#928374,bg=#282828
set -g status-justify left
set -g status-left-style fg=#928374,bg=#3c3836
set -g status-left-length 80
set -g status-right-style fg=#928374,bg=#3c3836
set -g status-right-length 20
setw -g window-status-separator ''
set -g status-left '#[bg=#504945,fg=#ebdbb2] #S #[bg=#3c3836,fg=#504945,nobold]'
set -g status-right '#[bg=#3c3836,fg=#504945,nobold]#[bg=#504945,fg=#ebdbb2] %H:%M '
setw -g window-status-current-format '#[bg=#fabd2f,fg=#3c3836,nobold]#[default,nobold] #I #[bold] #W#{?window_zoomed_flag,*Z,} #[bg=#3c3836,fg=#fabd2f,nobold]'
setw -g window-status-format '#[bg=#504945,fg=#3c3836,nobold]#[default] #I  #W #[bg=#3c3836,fg=#504945,nobold]'
