# Adapted 2026-09-04 from egel/tmux-gruvbox's light256 palette/status layout:
# https://github.com/egel/tmux-gruvbox (GPL-3.0; see COPYING).
# Converted from shell-generated commands to native tmux configuration.
set -g status on
set -g status-style bg=colour250,fg=colour237
setw -g window-status-style bg=colour136,fg=colour223
setw -g window-status-activity-style bg=colour223,fg=colour241
setw -g window-status-current-style bg=colour136,fg=colour223
set -g pane-active-border-style fg=colour239
set -g pane-border-style fg=colour223
set -g message-style bg=colour250,fg=colour237
set -g message-command-style bg=colour241,fg=colour223
set -g display-panes-active-colour colour239
set -g display-panes-colour colour223
setw -g clock-mode-colour colour24
setw -g window-status-bell-style bg=colour88,fg=colour229
set -g status-justify left
set -g status-left-style none
set -g status-left-length 80
set -g status-right-style none
set -g status-right-length 80
setw -g window-status-separator ''
set -g status-left '#[bg=colour239,fg=colour223] #S #[bg=colour250,fg=colour239,nobold,noitalics,nounderscore]'
set -g status-right '#[bg=colour250,fg=colour243,nobold,nounderscore,noitalics]#[bg=colour243,fg=colour223] %Y-%m-%d  %H:%M #[bg=colour243,fg=colour239,nobold,noitalics,nounderscore]#[bg=colour239,fg=colour223] #h'
setw -g window-status-current-format '#[bg=colour172,fg=colour250,nobold,noitalics,nounderscore]#[bg=colour172,fg=colour237] #I #[bg=colour172,fg=colour237,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour250]#[fg=colour172,nobold,noitalics,nounderscore]'
setw -g window-status-format '#[bg=colour248,fg=colour250,noitalics]#[bg=colour248,fg=colour239] #I #[bg=colour248,fg=colour239] #W #[bg=colour250]#[fg=colour248,noitalics]'
