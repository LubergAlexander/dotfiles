# Adapted 2026-09-04 from egel/tmux-gruvbox's light256 palette:
# https://github.com/egel/tmux-gruvbox (GPL-3.0; see COPYING).
# Converted from shell-generated commands to native tmux configuration.
# A continuous Gruvbox light1 rail separates status segments from the canvas.
set -g status on
set -g status-style bg=#ebdbb2,fg=#7c6f64
setw -g window-status-style bg=#d5c4a1,fg=#7c6f64
setw -g window-status-activity-style bg=#d5c4a1,fg=#3c3836
setw -g window-status-current-style bg=#b57614,fg=#fbf1c7,bold
set -g pane-active-border-style fg=#928374
set -g pane-border-style fg=#d5c4a1
set -g message-style bg=#ebdbb2,fg=#3c3836
set -g message-command-style bg=#ebdbb2,fg=#3c3836
set -g display-panes-active-colour '#928374'
set -g display-panes-colour '#d5c4a1'
setw -g clock-mode-colour '#076678'
setw -g window-status-bell-style bg=#d5c4a1,fg=#9d0006
set -g popup-border-lines rounded
set -g popup-style bg=#fbf1c7,fg=#3c3836
set -g popup-border-style fg=#928374,bg=#fbf1c7
set -g status-justify left
set -g status-left-style fg=#928374,bg=#ebdbb2
set -g status-left-length 80
set -g status-right-style fg=#928374,bg=#ebdbb2
set -g status-right-length 20
setw -g window-status-separator ''
set -g status-left '#[bg=#d5c4a1,fg=#3c3836] #S #[bg=#ebdbb2,fg=#d5c4a1,nobold]'
set -g status-right '#[bg=#ebdbb2,fg=#d5c4a1,nobold]#[bg=#d5c4a1,fg=#3c3836] %H:%M '
setw -g window-status-current-format '#[bg=#b57614,fg=#ebdbb2,nobold]#[default,nobold] #I #[bold] #W#{?window_zoomed_flag,*Z,} #[bg=#ebdbb2,fg=#b57614,nobold]'
setw -g window-status-format '#[bg=#d5c4a1,fg=#ebdbb2,nobold]#[default] #I  #W #[bg=#ebdbb2,fg=#d5c4a1,nobold]'
