modelRoles:
  default: openai-codex/gpt-6-astra:max
  slow: openai-codex/gpt-6-astra:max
  plan: openai-codex/gpt-6-astra:max
  vision: openai-codex/gpt-6-astra:high
  task: xai-oauth/grok-4.6:medium
  smol: xai-oauth/grok-4.6:low
  tiny: xai-oauth/grok-4.6:low
  commit: xai-oauth/grok-4.6:low
  advisor: anthropic/claude-opus-5:high
symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: dark-gruvbox
  light: light-gruvbox
setupVersion: 2
dev:
  autoqaConsent: granted
lsp:
  diagnosticsOnEdit: true
task:
  enableLsp: true
  agentModelOverrides:
    scout: "@smol:medium"
    sonic: "@tiny"
    task: "@task"
    reviewer: "@advisor"
    security-reviewer: "@advisor"
retry:
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-5.6-sol:max
    slow:
      - openai-codex/gpt-5.6-sol:max
    plan:
      - openai-codex/gpt-5.6-sol:max
    vision:
      - openai-codex/gpt-5.6-sol:high
    task:
      - openai-codex/gpt-5.6-sol:medium
    smol:
      - openai-codex/gpt-5.6-sol:low
    tiny:
      - openai-codex/gpt-5.6-sol:low
    commit:
      - openai-codex/gpt-5.6-sol:low
    advisor:
      - openai-codex/gpt-5.6-sol:high
