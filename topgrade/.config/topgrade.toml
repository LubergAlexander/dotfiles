# Only non-default settings; see `topgrade --edit-config` for the full reference.

[misc]
# brew_cask: replaced by the `brew cu` command below.
# cursor: the cursor-agent installer drops a ~/.local/bin/cursor shim that Topgrade
# mistakes for the IDE CLI; `cursor --version` always fails there.
disable = ["helix", "brew_cask", "cursor"]

[brew]
greedy_latest = true
greedy_auto_updates = true
# Upgrade formulae built from HEAD (`brew upgrade --fetch-HEAD`).
fetch_head = true

[commands]
# Casks are macOS-only; retain forced updates for casks marked as "latest".
"Brew Cask Upgrade" = "if [ \"$(uname -s)\" = Darwin ]; then brew cu -afy; fi"
